name: CI

# Runs on every push and on every pull request, so a regression is caught
# before review rather than after merge.
on:
  push:
  pull_request:

# A new push to the same branch cancels the run still going for the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches local development. Pinned rather than "3.x", so a new
          # Python release cannot change the result of a run.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: black --check .

      # No valstats.db and no API key exist here. Every test builds its own
      # in-memory database or reads a fixture committed to the repo.
      - name: Tests
        run: pytest -v
